<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="pdfapi">
  <!--
    Знак: плитка с фирменным градиентом и лист с загнутым углом.

    Внутри намеренно нет мелких деталей. Иконка живёт во вкладке размером
    16×16 — там любая штриховка, текст или тонкие линии превращаются в грязь.
    Силуэт листа читается даже в четыре пикселя высотой.

    Градиент здесь зафиксирован, а не взят из темы: иконку рисует браузер
    в своём интерфейсе, до всякого CSS, и переменных страницы там нет.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b5cf0" />
      <stop offset="1" stop-color="#2ad4e6" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)" />

  <!-- Лист -->
  <path
    d="M16 18a6 6 0 0 1 6-6h14l12 12v22a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z"
    fill="#ffffff"
  />

  <!-- Загнутый угол: та же белая бумага, но в тени -->
  <path d="M36 12l12 12h-7a5 5 0 0 1-5-5z" fill="#0b1020" opacity="0.22" />
</svg>
